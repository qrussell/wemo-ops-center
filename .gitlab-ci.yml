# Lightweight checks for merge requests and main.
# Having this file also turns off GitLab Auto DevOps for the project (its generic
# build/test/code_quality jobs don't apply to this repo and always failed).
# Release packages are built by GitHub Actions (.github/workflows/release.yml).

workflow:
  rules:
    # Merge request pipelines, and branch pipelines only for main (no duplicates
    # when a branch has an open merge request)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.12-slim
  interruptible: true

stages:
  - check

version:
  stage: check
  script:
    # Desktop app, server and Dockerfile label must carry the same version
    - VERSION=$(python universal-app/ci/get_version.py)
    - python universal-app/ci/get_version.py --check "v$VERSION"

python:
  stage: check
  script:
    - python -m py_compile universal-app/*.py universal-app/ci/*.py
    # The server must import with its runtime dependencies (as in the Docker image)
    - pip install --quiet --disable-pip-version-check flask waitress requests "pywemo>=2.1.1"
    - cd universal-app
    - python -c "import wemo_server as w; print('server', w.VERSION, 'imports OK; scan workers:', w.SCAN_WORKERS)"

shell:
  stage: check
  script:
    - for f in universal-app/*.sh; do bash -n "$f" || exit 1; echo "ok $f"; done
    # Shell scripts must keep LF line endings (CRLF breaks them on Linux/macOS)
    - if grep -l $'\r' universal-app/*.sh; then echo "CRLF line endings found"; exit 1; fi

workflows:
  stage: check
  script:
    # GitHub Actions workflows must be valid YAML with jobs
    - pip install --quiet --disable-pip-version-check pyyaml
    - |
      python - <<'EOF'
      import glob, yaml
      for path in sorted(glob.glob(".github/workflows/*.yml")):
          data = yaml.safe_load(open(path, encoding="utf-8"))
          assert isinstance(data, dict) and data.get("jobs"), f"{path}: no jobs"
          print(f"ok {path}: {', '.join(data['jobs'])}")
      EOF
